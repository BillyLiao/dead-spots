<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Dead Spots 指型練習簿：記錄自己的吉他指型與盲區，擲出 indie / dream pop / trip hop / post-punk / shoegaze 常見的和弦進行。">
<meta name="theme-color" content="#EFEDE8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Dead Spots">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Dead Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one working column — black masthead strip, tabs, then one tool surface per tab. Deliberately single-theme: photocopied paper, black ink, one red. Degrees are told apart by shape and fill so the page still reads in black and white. */
:root{
  --paper:#EFEDE8; --paper-2:#E5E2DB; --ink:#111111; --muted:#55524C; --rule:#111111; --faint:#BDB8AE;
  --red:#E8331F; --gray:#6E6B66;
  --good:#1E7A44; --warn:#E8331F;
  --f-display:"Archivo Narrow", "Noto Sans TC", "Arial Narrow", sans-serif;
  --f-body:"Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --f-mono:"Space Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;
  background-image:radial-gradient(rgba(17,17,17,.09) .7px,transparent .8px);background-size:5px 5px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* masthead */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-bottom:12px;border-bottom:3px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.02em;background:var(--ink);color:var(--paper);padding:4px 10px 3px;transform:rotate(-1.5deg)}
.brand .subt{font-family:var(--f-body);font-weight:700;font-size:15px;letter-spacing:.06em}
.sync{font:11px var(--f-mono);color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-transform:uppercase}
.sync i{width:8px;height:8px;background:var(--muted);display:inline-block}
.sync.db i{background:var(--good)} .sync.err i{background:var(--red)}
nav.tabs{display:flex;gap:0;border:2px solid var(--ink)}
nav.tabs button{border:0;border-right:2px solid var(--ink);background:var(--paper);padding:6px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
nav.tabs button:last-child{border-right:0}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;margin:12px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:700 9px var(--f-mono)}
/* degree encoding — shared by SVG circles (fill/stroke) and HTML dots (background/border) */
.fam-r{fill:var(--ink);background:var(--ink);color:var(--paper)}
.fam-t{fill:var(--red);background:var(--red);color:var(--ink)}
.fam-f{fill:var(--paper);background:var(--paper);color:var(--ink);stroke:var(--ink);stroke-width:1.6;box-shadow:inset 0 0 0 1.6px var(--ink)}
.fam-s{fill:var(--gray);background:var(--gray);color:var(--paper)}
.fam-x{fill:var(--paper);background:var(--paper);color:var(--ink);stroke:var(--ink);stroke-width:1.6;stroke-dasharray:2.4 1.8;outline:1.6px dashed var(--ink);outline-offset:-1.6px}
svg .fam-r,svg .fam-t,svg .fam-s{stroke:none}

section.panel{margin-top:22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{border:2px solid var(--ink);background:var(--paper);padding:3px 10px;font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn{border:2px solid var(--ink);background:var(--paper);padding:6px 12px;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.03em;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{background:var(--paper-2)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.primary{background:var(--red)}
.btn.small{padding:2px 8px;font-size:12.5px;box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-width:1.5px}
.btn.ghost:active{transform:none}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.label{font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.hint{font-size:12.5px;color:var(--muted)}

/* dice */
.dice-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end}
.rollbtn{font:700 24px var(--f-display);text-transform:uppercase;letter-spacing:.04em;padding:10px 22px;border:3px solid var(--ink);background:var(--red);color:var(--ink);display:inline-flex;align-items:center;gap:10px;box-shadow:5px 5px 0 var(--ink)}
.rollbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.rollbtn svg{width:24px;height:24px}
.rolling .rollbtn svg{animation:spin .5s steps(6)}
@keyframes spin{to{transform:rotate(360deg)}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:3px solid var(--ink);margin-top:18px;background:var(--paper)}
.fact{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;border-right:2px solid var(--ink)}
.fact:last-child{border-right:0}
.fact .v{font:700 34px/1.05 var(--f-display);letter-spacing:-.005em}
.fact .v.mono{font-family:var(--f-mono);font-weight:700;letter-spacing:-.03em}
.fact .sub{font:11.5px var(--f-mono);text-transform:uppercase}
.fact .lk{display:flex;justify-content:space-between;align-items:center;gap:6px}
.lock{border:0;background:none;padding:2px;line-height:0;opacity:.45}
.lock[aria-pressed="true"]{opacity:1;color:var(--red)}
.lock svg{width:15px;height:15px}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
.prog.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.prog.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.prog.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.ccard{background:var(--paper);border:2px solid var(--ink);padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ccard.now{background:var(--ink);color:var(--paper)}
.ccard.now .rn,.ccard.now .vinfo{color:var(--paper)}
.ccard.now svg.dg{background:var(--paper);outline:4px solid var(--paper)}
.ccard .rn{font:12px var(--f-mono);align-self:flex-start}
.ccard .nm{font:700 30px/1.05 var(--f-display);text-align:center}
.ccard .vinfo{font-size:12px;color:var(--muted);text-align:center;min-height:2.6em}
.ccard .vinfo em{font-style:normal;background:var(--red);color:var(--ink);padding:0 3px}
.ccard .none{font-size:13px;color:var(--muted);text-align:center;padding:24px 4px}
.ccard svg.dg{width:100%;max-width:150px;height:auto}
.playbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px;padding:8px 10px;border:2px solid var(--ink);background:var(--paper)}
.beats{display:flex;gap:6px}
.beats i{width:14px;height:14px;border:2px solid var(--ink);display:block}
.beats i.on{background:var(--ink)} .beats i.on.acc{background:var(--red)}
.feel{margin-top:12px;font-size:14px;max-width:65ch}

/* drill */
.drill{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:16px}
.card-stage{background:var(--paper);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;min-height:420px}
.prompt-q{font:12px var(--f-mono);text-transform:uppercase;color:var(--muted)}
.prompt-big{font:700 clamp(48px,9vw,80px)/.95 var(--f-display);letter-spacing:-.01em}
.prompt-big small{font:400 .3em var(--f-body);letter-spacing:0;margin-left:10px;color:var(--muted)}
.facts-inline{display:flex;flex-wrap:wrap;gap:6px}
.facts-inline span{border:1.5px solid var(--ink);padding:1px 8px;font-size:13px}
.stage-body{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;flex:1}
.stage-body svg.dg{width:200px;max-width:100%;height:auto}
.reveal-meta{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:340px}
.reveal-meta .nm{font:700 34px/1 var(--f-display)}
.grade{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grade .btn{min-width:110px}
.btn.ok{background:var(--paper)} .btn.bad{background:var(--red)}
kbd{font:10.5px var(--f-mono);border:1px solid currentColor;padding:0 4px;margin-left:6px;opacity:.7}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.side .box{border:2px solid var(--ink);background:var(--paper);padding:12px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:2px solid var(--ink)}
.seg button{flex:1;border:0;border-right:2px solid var(--ink);background:var(--paper);padding:5px 4px;font-size:13px;font-weight:700}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
label.tog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;cursor:pointer}
label.tog input{accent-color:var(--ink);width:16px;height:16px}
.statline{display:flex;justify-content:space-between;font-size:13.5px;border-bottom:1px dashed var(--faint);padding-bottom:2px}
.statline b{font-family:var(--f-mono)}

/* library */
.libbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
select{font:inherit;font-size:13px;padding:4px 8px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink)}
.libgroup{margin-top:24px}
.libgroup h2{font:700 24px var(--f-display);text-transform:uppercase;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.libgroup h2 .count{font:13px var(--f-mono)}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:12px}
.lcard{background:var(--paper);border:2px solid var(--ink);padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.lcard.blind{box-shadow:5px 5px 0 var(--red)}
.lcard svg.dg{width:100%;max-width:130px;height:auto;align-self:center}
.lcard .q{font:700 19px/1.15 var(--f-display)}
.lcard .meta{font-size:12px;color:var(--muted);line-height:1.4}
.lcard .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.tag{font-size:11px;padding:0 6px;background:var(--red);align-self:flex-start}
.tag.sug{background:transparent;border:1.5px dashed var(--ink)}
.empty{border:2px dashed var(--ink);padding:20px;font-size:14px;margin-top:10px;background:var(--paper)}
.backup{margin-top:30px;padding-top:14px;border-top:3px solid var(--ink);display:flex;flex-direction:column;gap:8px}
textarea{font:12px/1.4 var(--f-mono);width:100%;min-height:90px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);padding:8px}

/* editor */
.overlay{position:fixed;inset:0;background:rgba(239,237,232,.82);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;z-index:20;padding:24px 16px}
.editor{background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);width:100%;max-width:760px;padding:20px;display:flex;flex-direction:column;gap:14px}
.editor h2{font:700 26px var(--f-display);text-transform:uppercase}
.ed-cols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px}
.fb{display:grid;grid-template-columns:28px repeat(6,40px);gap:0;user-select:none}
.fb .hd{height:30px;display:grid;place-items:center}
.fb .hd button{width:28px;height:24px;border:1.5px solid var(--ink);background:var(--paper);font:700 12px var(--f-mono)}
.fb .hd button.open{background:var(--ink);color:var(--paper)}
.fb .fn{height:44px;display:grid;place-items:center;font:12px var(--f-mono)}
.fb .cell{height:44px;position:relative;border:0;background:none;padding:0}
.fb .cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--ink);transform:translateX(-50%)}
.fb .cell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ink);opacity:.4}
.fb .cell.c0::after{left:50%} .fb .cell.c5::after{right:50%}
.fb .cell .dot{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--f-mono);z-index:1}
.fb .cell .dot.pending{background:var(--ink)}
.fb .cell:hover .ghost{opacity:.3}
.fb .cell .ghost{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);opacity:0}
.fb .nutline{grid-column:2 / span 6;height:5px;background:var(--ink);margin:0 20px}
.fb .strlab{height:20px;display:grid;place-items:center;font:11px var(--f-mono)}
.ed-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.field input[type=text],.field textarea{font:inherit;font-size:14px;padding:6px 9px;border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);min-height:0}
.detect{border:2px solid var(--ink);padding:10px 12px;font-size:14px}
.detect .big{font:700 24px var(--f-display)}
.ed-acts{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1deg);background:var(--ink);color:var(--paper);padding:6px 14px;font:700 14px var(--f-display);text-transform:uppercase;letter-spacing:.04em;z-index:30}

svg.dg text{font-family:var(--f-mono)}
svg.dg .str{stroke:var(--ink);stroke-width:1.3}
svg.dg .frt{stroke:var(--ink);stroke-opacity:.35;stroke-width:1.2}
svg.dg .nut{stroke:var(--ink);stroke-width:5}
svg.dg .fno{fill:var(--ink);font-size:9px;font-weight:700}
svg.dg .mk{fill:var(--ink);font-size:10px}
svg.dg .lbl{font-size:8.5px;font-weight:700;fill:var(--ink)}
svg.dg .lbl.lf-r,svg.dg .lbl.lf-s{fill:var(--paper)}
svg.dg .neutral{fill:var(--ink)}
svg.dg .ring{stroke-width:2}
svg.dg .ring.fam-r{fill:var(--ink)} svg.dg .ring.fam-t{fill:var(--red)} svg.dg .ring.fam-s{fill:var(--gray)}
svg.dg .ring.neutral{stroke:var(--ink);fill:none}
svg.dg .rlbl{font-size:7.5px;font-weight:700;fill:var(--ink)}
svg.dg .rlbl.lf-r,svg.dg .rlbl.lf-s{fill:var(--paper)}

@media (max-width:760px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fact:nth-child(2){border-right:0} .fact:nth-child(-n+2){border-bottom:2px solid var(--ink)}
  .prog,.prog.n3,.prog.n5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .drill{grid-template-columns:minmax(0,1fr)}
  .ed-cols{grid-template-columns:minmax(0,1fr)}
  .fb{justify-self:center}
  .dice-head{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){ .fb{grid-template-columns:24px repeat(6,36px)} .ccard .nm{font-size:24px} .brand h1{font-size:26px} }
@media (prefers-reduced-motion:reduce){ .rolling .rollbtn svg{animation:none} }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Dead Spots</h1><span class="subt">指型練習簿</span>
      <span class="sync" id="sync"><i></i><span>本機暫存</span></span>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="dice" aria-selected="true">擲骰子</button>
      <button role="tab" data-tab="drill" aria-selected="false">盲區練習</button>
      <button role="tab" data-tab="lib" aria-selected="false">指型庫</button>
    </nav>
  </header>
  <div class="legend" aria-label="音級顏色">
    <span><b class="fam-r">1</b>根音（實心黑）</span>
    <span><b class="fam-t">3</b>三度（紅）</span>
    <span><b class="fam-f">5</b>五度（空心）</span>
    <span><b class="fam-s">7</b>七度（灰）</span>
    <span><b class="fam-x">9</b>延伸音 9 / 11 / 6（虛線）</span>
  </div>

  <section class="panel" id="tab-dice"></section>
  <section class="panel" id="tab-drill" hidden></section>
  <section class="panel" id="tab-lib" hidden></section>
</div>
<div id="overlay-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="core.js"></script>
<script>
/* ============ state & storage ============ */
let S={chords:[],flags:{},stats:{}};
const LS_DATA='chordnb.data.v1',LS_UI='chordnb.ui.v1';
let ui={tab:'dice',styles:STYLES.map(s=>s[0]),locks:{key:false,bpm:false,prog:false},barsMode:'auto',
  p:{mode:'mix',onlyBlind:false,builtin:true,randomRoot:true},libFilter:'all',libQ:''};
let roll=null, card=null, revealed=false, recent=[], sessionDone=0, sessionHard=0, editing=null, pendingDelete=null;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
(function(){const u=lsGet(LS_UI);if(u)ui={...ui,...u,locks:{...ui.locks,...(u.locks||{})},p:{...ui.p,...(u.p||{})}};
  const d=lsGet(LS_DATA);if(d)S={chords:d.chords||[],flags:d.flags||{},stats:d.stats||{}};})();
const saveUi=()=>lsSet(LS_UI,ui);
function requestPersist(){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}}

let mode='local',libRef=null,statRef=null,lastLib='',lastStat='',dirty={lib:false,stats:false},saveTimer=null,flushing=false;
function setSync(kind,text){const el=document.getElementById('sync');el.className='sync '+kind;el.querySelector('span').textContent=text;}
function queueSave(kind){dirty[kind]=true;lsSet(LS_DATA,S);clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);}
async function flush(){
  if(mode!=='db'){dirty.lib=dirty.stats=false;return;}
  if(flushing){saveTimer=setTimeout(flush,400);return;}
  flushing=true;
  try{
    if(dirty.lib){dirty.lib=false;lastLib=JSON.stringify({c:S.chords,f:S.flags});await libRef.set({chords:S.chords,flags:S.flags,v:1});}
    if(dirty.stats){dirty.stats=false;lastStat=JSON.stringify(S.stats);await statRef.set({s:S.stats,v:1});}
    setSync('db','已同步到你的帳號');
  }catch(e){setSync('err',e&&e.code==='quota_exceeded'?'空間已滿，請刪掉一些指型':'同步失敗，資料先存在本機');}
  finally{flushing=false;}
}
async function initStore(){
  setSync('','存在這個瀏覽器');requestPersist();
  if(!window.claude||!window.claude.use)return;
  try{
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    libRef=db.doc('data/users/'+id+'/library');statRef=db.doc('data/users/'+id+'/stats');
    mode='db';setSync('db','連線中…');
    libRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||dirty.lib)return;
      if(!snap.exists){if(S.chords.length||Object.keys(S.flags).length)queueSave('lib');setSync('db','已同步到你的帳號');return;}
      const d=snap.data(),j=JSON.stringify({c:d.chords||[],f:d.flags||{}});
      setSync('db','已同步到你的帳號');
      if(j===lastLib)return;lastLib=j;
      S.chords=JSON.parse(JSON.stringify(d.chords||[]));S.flags=JSON.parse(JSON.stringify(d.flags||{}));
      lsSet(LS_DATA,S);renderAll();
    },()=>setSync('err','同步中斷，資料先存在本機'));
    statRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites||dirty.stats)return;
      if(!snap.exists){if(Object.keys(S.stats).length)queueSave('stats');return;}
      const d=snap.data(),j=JSON.stringify(d.s||{});if(j===lastStat)return;lastStat=j;
      S.stats=JSON.parse(j);lsSet(LS_DATA,S);if(ui.tab!=='dice')renderAll();
    },()=>{});
  }catch(e){mode='local';setSync('','存在這個瀏覽器');}
}

/* ============ diagram ============ */
function diagram(frets,root,opt={}){
  const labels=opt.labels!==false;
  const set=root!=null&&frets[root]>=0?relSet(frets,root):new Set();
  const rr=root!=null&&frets[root]>=0?rels(frets,root):frets.map(()=>null);
  const fr=fretted(frets),maxF=fr.length?Math.max(...fr):0,minF=fr.length?Math.min(...fr):1;
  const start=maxF<=4?1:minF,rows=Math.max(4,maxF-start+1);
  const L=24,T=24,sx=18,fy=22,W=L+5*sx+16,H=T+rows*fy+10;
  let s=`<svg class="dg" viewBox="0 0 ${W} ${H}" role="img" aria-label="和弦圖">`;
  for(let i=0;i<=rows;i++)s+=`<line class="frt" x1="${L}" x2="${L+5*sx}" y1="${T+i*fy}" y2="${T+i*fy}"/>`;
  for(let i=0;i<6;i++)s+=`<line class="str" x1="${L+i*sx}" x2="${L+i*sx}" y1="${T}" y2="${T+rows*fy}"/>`;
  if(start===1)s+=`<line class="nut" x1="${L-1}" x2="${L+5*sx+1}" y1="${T}" y2="${T}"/>`;
  else s+=`<text class="fno" x="${L-6}" y="${T+fy*0.5+3}" text-anchor="end">${start}</text>`;
  for(let i=0;i<6;i++){
    const x=L+i*sx,f=frets[i];
    if(f<0){s+=`<text class="mk" x="${x}" y="${T-9}" text-anchor="middle">×</text>`;continue;}
    const rel=rr[i],fm=rel!=null?fam(rel,set):'x',lab=rel!=null?degLabel(rel,set):'';
    if(f===0){
      if(labels&&rel!=null){s+=`<circle class="ring fam-${fm}" cx="${x}" cy="${T-11}" r="6.5"/><text class="rlbl lf-${fm}" x="${x}" y="${T-8.3}" text-anchor="middle">${lab}</text>`;}
      else s+=`<circle class="ring neutral" cx="${x}" cy="${T-11}" r="4.5"/>`;
      continue;
    }
    const cy=T+(f-start+0.5)*fy;
    if(labels&&rel!=null){s+=`<circle class="fam-${fm}" cx="${x}" cy="${cy}" r="8"/><text class="lbl lf-${fm}" x="${x}" y="${cy+3}" text-anchor="middle">${lab}</text>`;}
    else s+=`<circle class="neutral" cx="${x}" cy="${cy}" r="7"/>`;
  }
  return s+'</svg>';
}

function doRoll(){
  const L=ui.locks;
  let prog=L.prog&&roll?roll.prog:null;
  if(!prog){
    const sel=new Set(ui.styles.length?ui.styles:STYLES.map(s=>s[0]));
    const pool=PROGS.filter(p=>p.st.some(x=>sel.has(x))&&(!roll||p!==roll.prog||PROGS.length<2));
    prog=weighted(pool.map(p=>({...p,_p:p,w:p.w})))._p;
  }
  const sel=ui.styles.length?ui.styles:STYLES.map(s=>s[0]);
  const stOpts=prog.st.filter(s=>sel.includes(s));
  const style=L.prog&&roll&&stOpts.includes(roll.style)?roll.style:(stOpts.length?stOpts:prog.st)[Math.floor(Math.random()*(stOpts.length||prog.st.length))];
  const key=L.key&&roll?roll.key:pickKey(prog.minor);
  const bpm=L.bpm&&roll?roll.bpm:genBpm(style);
  const meter=(style==='dream'||style==='shoegaze')&&Math.random()<0.12?3:4;
  roll={prog,style,key,bpm,meter,chords:buildChords(prog,key)};
  voiceAll();
  resetMetroPosition();
}
function pickVoicing(c,center,excludeId){return pickVoicingFrom(allShapes(),prio,c,center,excludeId);}
function voiceAll(){let center=3+Math.random()*4;for(const c of roll.chords){c.v=pickVoicing(c,center);if(c.v)center=c.v.center*0.6+center*0.4;}}
function barsPer(){if(ui.barsMode!=='auto')return+ui.barsMode;return roll.chords.length<=2?2:1;}

/* metronome */
let audio=null;const metro={on:false,next:0,beat:0,bar:0,timer:null};
function resetMetroPosition(){metro.beat=0;metro.bar=0;if(audio)metro.next=audio.currentTime+0.08;}
function startMetro(){
  try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();}catch(e){toast('這個瀏覽器不能播放聲音');return;}
  audio.resume();metro.on=true;resetMetroPosition();metro.timer=setInterval(schedule,25);
}
function stopMetro(){metro.on=false;clearInterval(metro.timer);document.querySelectorAll('.ccard.now').forEach(e=>e.classList.remove('now'));document.querySelectorAll('#beats i').forEach(e=>e.classList.remove('on'));}
function schedule(){
  if(!roll)return;const spb=60/roll.bpm;
  while(metro.next<audio.currentTime+0.12){
    const acc=metro.beat===0;click(metro.next,acc);
    const b=metro.beat,bar=metro.bar,delay=(metro.next-audio.currentTime)*1000;
    setTimeout(()=>showBeat(b,bar),Math.max(0,delay));
    metro.next+=spb;metro.beat++;if(metro.beat>=roll.meter){metro.beat=0;metro.bar++;}
  }
}
function click(t,acc){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=acc?1600:1050;g.gain.setValueAtTime(acc?0.45:0.25,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+0.06);}
function showBeat(b,bar){
  if(!metro.on||ui.tab!=='dice')return;
  document.querySelectorAll('#beats i').forEach((e,i)=>e.classList.toggle('on',i===b));
  const ci=Math.floor(bar/barsPer())%roll.chords.length;
  document.querySelectorAll('.ccard').forEach(e=>e.classList.toggle('now',+e.dataset.ci===ci));
}

/* ============ drill ============ */
function drillPool(){
  return allShapes().filter(s=>{
    if(s.root==null||s.frets[s.root]<0)return false;
    if(ui.p.onlyBlind&&!isBlind(s))return false;
    if(!ui.p.builtin&&s.src==='builtin'&&!isBlind(s))return false;
    return true;
  });
}
function drillWeight(s){const st=S.stats[s.id]||{n:0,miss:0};return drillWeightOf(prio(s),st.n,st.miss,recent.indexOf(s.id));}
function nextCard(){
  const pool=drillPool();revealed=false;
  if(!pool.length){card=null;return;}
  const s=weighted(pool.map(sh=>({sh,w:drillWeight(sh)}))).sh;
  const m=ui.p.mode==='mix'?(Math.random()<0.5?'name':'shape'):ui.p.mode;
  let pc=null,d=0;
  if(ui.p.randomRoot){
    if(hasOpen(s.frets)){pc=mod(rootMidi(s.frets,s.root),12);}
    else{const tries=[...Array(12).keys()].sort(()=>Math.random()-0.5);
      for(const t of tries){const pl=placements(s,t);if(pl.length){pc=t;d=pl.reduce((a,b)=>Math.abs(centerOf(shifted(s.frets,b))-6)<Math.abs(centerOf(shifted(s.frets,a))-6)?b:a);break;}}}
  }
  card={id:s.id,mode:m,pc,d};
  recent.unshift(s.id);recent=recent.slice(0,Math.min(4,Math.max(0,pool.length-1)));
}
function grade(hard){
  if(!card)return;
  const st=S.stats[card.id]||{n:0,miss:0,last:0};
  st.n++;if(hard)st.miss++;st.last=Date.now();S.stats[card.id]=st;
  sessionDone++;if(hard)sessionHard++;
  queueSave('stats');nextCard();renderDrill();
}

    <span class="q">${esc(shapeTitle(s))}</span>
    <span class="meta">${s.name?esc(qLabel(q))+' · ':''}${esc(shapeDesc(s))}<br>${st&&st.n?`練 ${st.n} · 卡 ${st.miss}`:'還沒練過'}</span>
    ${sug?'<span class="tag sug">常卡住，建議加入盲區</span>':''}
    <div class="acts">
      <button class="btn small" data-blind="${esc(s.id)}" aria-pressed="${isBlind(s)}">${isBlind(s)?'盲區 ✓':'加入盲區'}</button>
      ${s.src==='custom'
        ?`<button class="btn small ghost" data-edit="${esc(s.id)}">編輯</button><button class="btn small ghost" data-del="${esc(s.id)}" style="${confirmDel?'color:var(--warn);border-color:var(--warn)':''}">${confirmDel?'確定刪除':'刪除'}</button>`
        :`<button class="btn small ghost" data-copy="${esc(s.id)}">複製編輯</button>`}
    </div></div>`;
}

/* ============ editor ============ */
function openEditor(src,opts={}){
  editing=src?{id:src.src==='custom'?src.id:null,name:src.src==='custom'?src.name||'':'',frets:[...src.frets],root:src.root,notes:src.notes||'',fixedQ:src.src==='custom'?src.fixedQ||'':'',blind:src.src==='custom'?!!src.blind:true,start:1,tool:'place'}
    :{id:null,name:'',frets:[-1,-1,-1,-1,-1,-1],root:null,notes:'',fixedQ:'',blind:true,start:1,tool:'place',wantQ:opts.wantQ||''};
  const fr=fretted(editing.frets);if(fr.length){const mx=Math.max(...fr);editing.start=mx<=6?1:Math.max(1,Math.min(...fr)-1);}
  renderEditor();
}
function closeEditor(){editing=null;document.getElementById('overlay-root').innerHTML='';}
function renderEditor(){
  const e=editing,root=document.getElementById('overlay-root');
  if(!e){root.innerHTML='';return;}
  const valid=e.root!=null&&e.frets[e.root]>=0;
  const set=valid?relSet(e.frets,e.root):new Set(),rr=valid?rels(e.frets,e.root):[];
  const det=valid?detectQ(e.frets,e.root):null;
  let grid=`<div></div>`;
  for(let i=0;i<6;i++){const f=e.frets[i];grid+=`<div class="hd"><button data-os="${i}" class="${f===0?'open':''}" title="切換空弦 / 悶音">${f===0?'○':f<0?'×':'·'}</button></div>`;}
  if(e.start===1)grid+=`<div></div><div class="nutline"></div>`;
  for(let r=0;r<6;r++){
    const fret=e.start+r;grid+=`<div class="fn">${fret}</div>`;
    for(let i=0;i<6;i++){
      const on=e.frets[i]===fret;let dot='';
      if(on){if(valid){const fm=fam(rr[i],set);dot=`<span class="dot fam-${fm}">${degLabel(rr[i],set)}</span>`;}else dot=`<span class="dot pending"></span>`;}
      grid+=`<button class="cell c${i}" data-cell="${i}:${fret}" aria-label="${strNo(i)} 弦 第 ${fret} 格">${dot||'<span class="ghost"></span>'}</button>`;
    }
  }
  grid+=`<div></div>`+[6,5,4,3,2,1].map(n=>`<div class="strlab">${n}</div>`).join('');
  const bi=bassIdx(e.frets);
  root.innerHTML=`<div class="overlay" id="ov"><div class="editor" role="dialog" aria-modal="true" aria-label="編輯指型">
    <h2>${e.id?'編輯指型':'新增指型'}</h2>
    ${e.wantQ?`<p class="hint">骰子需要一個 ${esc(qLabel(e.wantQ))} 指型。</p>`:''}
    <div class="ed-cols">
      <div class="field" style="gap:10px">
        <div class="seg" style="max-width:300px">
          <button data-tool="place" aria-pressed="${e.tool==='place'}">按音</button>
          <button data-tool="root" aria-pressed="${e.tool==='root'}">設根音</button>
        </div>
        <div class="fb">${grid}</div>
        <div class="row"><button class="btn small" id="st-up" ${e.start<=1?'disabled':''}>▲ 往琴頭</button><span class="hint mono">第 ${e.start}–${e.start+5} 格</span><button class="btn small" id="st-dn" ${e.start>=14?'disabled':''}>▼ 往琴身</button><button class="btn small ghost" id="clr">清空</button></div>
        <p class="hint" style="max-width:300px">${e.tool==='place'?'點格子放音，同一格再點一次會拿掉。上方按鈕切換空弦 ○ / 悶音 ×。':'點任何一個有按的音（或空弦），把它設成根音。根音不必在最低音，轉位就是這樣記。'}</p>
      </div>
      <div class="ed-side">
        <div class="detect">${valid
          ?`<span class="big">${esc(qLabel(e.fixedQ||det))}</span>${e.fixedQ&&e.fixedQ!==det?` <span class="hint">（自動判斷：${esc(qLabel(det))}）</span>`:''}<br><span class="hint">${invName(rr[bi])} · 根音在 ${strNo(e.root)} 弦 · 組成 ${rr.map(x=>x==null?null:degLabel(x,set)).filter(Boolean).join(' ')}</span>`
          :`<span class="hint">${e.frets.some(x=>x>=0)?'切到「設根音」，點一下根音在哪。':'先在左邊放音。'}</span>`}</div>
        <div class="field"><label class="label" for="ed-name">名稱（可不填）</label><input type="text" id="ed-name" value="${esc(e.name)}" placeholder="例如：螢火蟲 verse 的 maj7"></div>
        <div class="field"><label class="label" for="ed-q">和弦性質</label>
          <select id="ed-q"><option value="">自動判斷${det?'（'+esc(qLabel(det))+'）':''}</option>${QUAL_OPTIONS.map(q=>`<option value="${q}" ${e.fixedQ===q?'selected':''}>${esc(qLabel(q))}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="ed-notes">筆記</label><textarea id="ed-notes" rows="2" placeholder="哪裡卡、手指怎麼擺">${esc(e.notes)}</textarea></div>
        <label class="tog" for="ed-blind">標成盲區<input type="checkbox" id="ed-blind" ${e.blind?'checked':''}></label>
        <div class="ed-acts"><button class="btn ghost" id="ed-cancel">取消</button><button class="btn primary" id="ed-save" ${valid?'':'disabled'}>儲存</button></div>
      </div>
    </div></div></div>`;
}
function editorClick(t){
  const e=editing;
  const cell=t.closest('[data-cell]'),os=t.closest('[data-os]'),tool=t.closest('[data-tool]');
  if(tool){e.tool=tool.dataset.tool;return renderEditor();}
  if(os){const i=+os.dataset.os;
    if(e.tool==='root'){if(e.frets[i]===0){e.root=i;}return renderEditor();}
    e.frets[i]=e.frets[i]===0?-1:0;if(e.frets[i]<0&&e.root===i)e.root=null;return renderEditor();}
  if(cell){const[i,f]=cell.dataset.cell.split(':').map(Number);
    if(e.tool==='root'){if(e.frets[i]===f)e.root=i;else{e.frets[i]=f;e.root=i;}return renderEditor();}
    if(e.frets[i]===f){e.frets[i]=-1;if(e.root===i)e.root=null;}else e.frets[i]=f;
    return renderEditor();}
  if(t.closest('#st-up')){e.start=Math.max(1,e.start-1);return renderEditor();}
  if(t.closest('#st-dn')){e.start=Math.min(14,e.start+1);return renderEditor();}
  if(t.closest('#clr')){e.frets=[-1,-1,-1,-1,-1,-1];e.root=null;return renderEditor();}
  if(t.closest('#ed-cancel')||t.id==='ov'){return closeEditor();}
  if(t.closest('#ed-save')){
    if(e.root==null||e.frets[e.root]<0)return;
    const data={id:e.id||('c-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),name:e.name.trim(),frets:[...e.frets],root:e.root,notes:e.notes.trim(),fixedQ:e.fixedQ,blind:e.blind,src:'custom',created:Date.now()};
    const i=S.chords.findIndex(c=>c.id===data.id);
    if(i>=0){data.created=S.chords[i].created||data.created;S.chords[i]=data;}else S.chords.unshift(data);
    queueSave('lib');closeEditor();toast(i>=0?'已更新':'已加入指型庫');
    if(roll&&roll.chords.some(c=>!c.v))voiceAll();
    renderAll();
  }
}

/* ============ wiring ============ */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800);}
function setTab(tab){
  ui.tab=tab;saveUi();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  for(const t of['dice','drill','lib'])document.getElementById('tab-'+t).hidden=t!==tab;
  renderAll();
}
function renderAll(){
  if(ui.tab==='dice')renderDice();else if(ui.tab==='drill')renderDrill();else renderLib();
}
function animateBpm(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.getElementById('bpmv');if(!el)return;const target=roll.bpm;let n=0;
  const iv=setInterval(()=>{n++;el.textContent=n>=8?target:Math.round(60+Math.random()*100);if(n>=8)clearInterval(iv);},35);
}

document.addEventListener('click',ev=>{
  const t=ev.target;
  if(editing&&t.closest('#overlay-root'))return editorClick(t);
  const tab=t.closest('[data-tab]');if(tab)return setTab(tab.dataset.tab);
  const bl=t.closest('[data-blind]');if(bl){const s=findShape(bl.dataset.blind);if(s){toggleBlind(s);toast(isBlind(s)?'已加入盲區':'已移出盲區');renderAll();}return;}
  // dice
  if(t.closest('#roll')){doRoll();renderDice();animateBpm();document.querySelector('.dice-head')?.classList.add('rolling');setTimeout(()=>document.querySelector('.dice-head')?.classList.remove('rolling'),500);return;}
  const st=t.closest('[data-style]');if(st){const id=st.dataset.style;ui.styles=ui.styles.includes(id)?ui.styles.filter(x=>x!==id):[...ui.styles,id];saveUi();return renderDice();}
  const lk=t.closest('[data-lock]');if(lk){const k=lk.dataset.lock;ui.locks[k]=!ui.locks[k];saveUi();return renderDice();}
  const rv=t.closest('[data-revoice]');if(rv){const i=+rv.dataset.revoice,c=roll.chords[i],prev=roll.chords[i-1];c.v=pickVoicing(c,prev&&prev.v?prev.v.center:(c.v?c.v.center:5),c.v&&c.v.id);return renderDice();}
  if(t.closest('#revoice')){voiceAll();return renderDice();}
  if(t.closest('#metro')){metro.on?stopMetro():startMetro();t.closest('#metro').textContent=metro.on?'■ 停止':'▶ 節拍器';return;}
  const nq=t.closest('[data-newq]');if(nq)return openEditor(null,{wantQ:nq.dataset.newq});
  // drill
  if(t.closest('#reveal')){revealed=true;return renderDrill();}
  if(t.closest('#skip')){nextCard();return renderDrill();}
  if(t.closest('#g-ok'))return grade(false);
  if(t.closest('#g-bad'))return grade(true);
  const pm=t.closest('[data-pmode]');if(pm){ui.p.mode=pm.dataset.pmode;saveUi();nextCard();return renderDrill();}
  // library
  const lf=t.closest('[data-lf]');if(lf){ui.libFilter=lf.dataset.lf;saveUi();return renderLib();}
  if(t.closest('#new-shape'))return openEditor(null);
  const ed=t.closest('[data-edit]');if(ed)return openEditor(findShape(ed.dataset.edit));
  const cp=t.closest('[data-copy]');if(cp)return openEditor(findShape(cp.dataset.copy));
  const dl=t.closest('[data-del]');if(dl){const id=dl.dataset.del;
    if(pendingDelete===id){S.chords=S.chords.filter(c=>c.id!==id);delete S.stats[id];pendingDelete=null;queueSave('lib');queueSave('stats');toast('已刪除');}
    else{pendingDelete=id;setTimeout(()=>{if(pendingDelete===id){pendingDelete=null;if(ui.tab==='lib')renderLib();}},3000);}
    return renderLib();}
  if(t.closest('#exp')){const txt=JSON.stringify({chords:S.chords,flags:S.flags,stats:S.stats},null,1);const box=document.getElementById('iobox');box.value=txt;
    const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
    p.then(()=>toast('已複製到剪貼簿'),()=>{box.select();toast('已選取，請手動複製');});return;}
  if(t.closest('#imp')){try{const d=JSON.parse(document.getElementById('iobox').value);
      if(!Array.isArray(d.chords))throw 0;
      const ok=d.chords.filter(c=>c&&Array.isArray(c.frets)&&c.frets.length===6&&Number.isInteger(c.root)).map(c=>({...c,src:'custom'}));
      const ids=new Set(ok.map(c=>c.id));S.chords=[...ok,...S.chords.filter(c=>!ids.has(c.id))];
      S.flags={...S.flags,...(d.flags||{})};S.stats={...S.stats,...(d.stats||{})};
      queueSave('lib');queueSave('stats');toast('匯入 '+ok.length+' 個指型');renderLib();
    }catch(e){toast('JSON 格式不對，請貼上「複製 JSON」產生的內容');}return;}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='bars'){ui.barsMode=t.value;saveUi();return;}
  if(t.id==='p-rr'){ui.p.randomRoot=t.checked;saveUi();nextCard();return renderDrill();}
  if(t.id==='p-ob'){ui.p.onlyBlind=t.checked;saveUi();nextCard();return renderDrill();}
  if(t.id==='p-bi'){ui.p.builtin=t.checked;saveUi();nextCard();return renderDrill();}
  if(t.id==='libq'){ui.libQ=t.value;saveUi();return renderLib();}
  if(editing){
    if(t.id==='ed-q'){editing.fixedQ=t.value;return renderEditor();}
    if(t.id==='ed-blind'){editing.blind=t.checked;return;}
  }
});
document.addEventListener('input',ev=>{
  if(!editing)return;const t=ev.target;
  if(t.id==='ed-name')editing.name=t.value;
  if(t.id==='ed-notes')editing.notes=t.value;
});
document.addEventListener('keydown',ev=>{
  if(editing){if(ev.key==='Escape')closeEditor();return;}
  if(ui.tab!=='drill'||!card)return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||''))return;
  if((ev.key===' '||ev.key==='Enter')&&!revealed){ev.preventDefault();revealed=true;renderDrill();}
  else if(revealed&&ev.key==='1')grade(false);
  else if(revealed&&ev.key==='2')grade(true);
  else if(revealed&&(ev.key==='b'||ev.key==='B')){const s=findShape(card.id);if(s){toggleBlind(s);renderDrill();}}
});

doRoll();
setTab(['dice','drill','lib'].includes(ui.tab)?ui.tab:'dice');
initStore();
</script>
