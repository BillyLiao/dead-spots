name: test
# main 的測試在 deploy.yml 裡跑（測試通過才部署），這裡只管其他分支和 PR。
on:
  push:
    branches-ignore: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
