name: deploy
# push 到 main：先跑測試，通過才部署到 GitHub Pages。也可以在 Actions 頁面手動執行。
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 只上傳網站需要的檔案（index.html 引用到的檔案都要列在這裡，test/page.test.js 會檢查）
      - name: Collect site files
        run: mkdir _site && cp index.html core.js favicon.svg apple-touch-icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for f in "" core.js favicon.svg; do curl -fsS -o /dev/null "${url}${f}" && echo "ok ${url}${f}"; done
